services:
  - type: web
    name: sentry-fraud-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./transactions.db
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app","http://localhost:5173","http://127.0.0.1:5173"]'
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
